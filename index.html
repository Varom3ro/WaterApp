<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Tu Empresa - Sistema de Gestión para Recarga de Agua Potable" />
  <meta name="theme-color" content="#1B4332" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WaterApp" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
  <link rel="apple-touch-icon" href="img/icon-192.png" />
  <title>Tu Empresa - Gestión de Agua v2.0</title>
  <link rel="stylesheet" href="css/styles.css?v=2.8.9" />
</head>

<body>
  <div id="app"></div>
  <script>
    window.addEventListener('error', function(e) {
      const msg = e.message || '';
      if (msg.includes('ResizeObserver') || msg.includes('Script error')) return;
      console.error('[App Error]', e);
    });
    window.addEventListener('unhandledrejection', function(e) {
      const msg = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
      if (msg.includes('ServiceWorker') || msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
        console.warn('[PWA/Network]: Error de red o actualización de Service Worker ignorado:', e.reason);
        return;
      }
      console.error('[Unhandled Rejection]', e.reason);
    });
  </script>
  <script src="js/qrcode.min.js"></script>
  <script src="js/html2pdf.bundle.min.js"></script>
  <script type="module" src="js/app.js?v=2.8.9"></script>
</body>

</html>
